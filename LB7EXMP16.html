<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Example 16 - Flat Tree Density Test</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .title {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="title">Hexagon Tree Density (Flat View)</div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYXR1cm5lIiwiYSI6ImNtN3c2dzhmdjAyaDQyam9lcHZndXQzOGYifQ.U54u7RnEjwr5J8Bu7mwCEA';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/aturne/cm9k4c7th00nm01rc4s3qbtvt',
    center: [-104.99, 39.74],
    zoom: 11
  });

  map.on('load', () => {
    map.addSource('hex-source', {
      type: 'vector',
      url: 'mapbox://aturne.d5ip55q3'
    });

    map.addLayer({
      id: 'hex-layer',
      type: 'fill',
      source: 'hex-source',
      'source-layer': 'denver_hexagon_tree_count_top-8iktl8',
      paint: {
        'fill-color': [
          'interpolate',
          ['sqrt'],
          ['coalesce', ['get', 'total'], 0],
          0, '#ffffcc',
          10, '#a1dab4',
          50, '#41b6c4',
          100, '#2c7fb8',
          200, '#253494'
        ],
        'fill-opacity': 0.85
      }
    });
  });
</script>

</body>
</html>
