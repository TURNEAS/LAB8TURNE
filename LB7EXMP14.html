<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Example 14 - Revised Tree Genus Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    .legend {
      position: absolute;
      left: 10px;
      top: 70px;
      background-color: white;
      padding: 10px;
      font-family: sans-serif;
      font-size: 12px;
      border-radius: 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .legend div {
      margin-bottom: 5px;
    }

    .legend span {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 5px;
    }

    .title {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px 15px;
      font-size: 18px;
      font-family: sans-serif;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="title">Top 10 Tree Genera in Denver</div>
<div class="legend" id="legend">
  <div><span style="background-color: #e6194b;"></span>Ash</div>
  <div><span style="background-color: #3cb44b;"></span>Crabapple</div>
  <div><span style="background-color: #ffe119;"></span>Elm</div>
  <div><span style="background-color: #4363d8;"></span>Hackberry</div>
  <div><span style="background-color: #f58231;"></span>Honeylocust</div>
  <div><span style="background-color: #911eb4;"></span>Linden</div>
  <div><span style="background-color: #46f0f0;"></span>Maple</div>
  <div><span style="background-color: #f032e6;"></span>Oak</div>
  <div><span style="background-color: #bcf60c;"></span>Pine</div>
  <div><span style="background-color: #fabebe;"></span>Spruce</div>
</div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYXR1cm5lIiwiYSI6ImNtN3c2dzhmdjAyaDQyam9lcHZndXQzOGYifQ.U54u7RnEjwr5J8Bu7mwCEA';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/aturne/cm9k4c7th00nm01rc4s3qbtvt',
    center: [-104.99, 39.74],
    zoom: 11
  });

  map.on('load', () => {
    map.addSource('tree-points', {
      type: 'vector',
      url: 'mapbox://aturne.4k83tzqi'
    });

    map.addLayer({
      id: 'tree-genus-layer',
      type: 'circle',
      source: 'tree-points',
      'source-layer': 'denver_tree_top_10_genus-8pmsrp',
      paint: {
        'circle-radius': 4,
        'circle-color': [
          'match',
          ['get', 'Genus'],
          'Ash', '#e6194b',
          'Crabapple', '#3cb44b',
          'Elm', '#ffe119',
          'Hackberry', '#4363d8',
          'Honeylocust', '#f58231',
          'Linden', '#911eb4',
          'Maple', '#46f0f0',
          'Oak', '#f032e6',
          'Pine', '#bcf60c',
          'Spruce', '#fabebe',
          '#999999' // fallback
        ],
        'circle-opacity': 0.85
      }
    });
  });
</script>

</body>
</html>
